name: Scheduled ML Training & Retrain

on:
  schedule:
    - cron: '0 18 * * *'  # 每天 UTC 18:00（北京时间次日凌晨 2:00）
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/content/blog/**'
      - 'train.py'

concurrency:
  group: train-ml
  cancel-in-progress: false

jobs:
  train-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Cache HuggingFace model
      uses: actions/cache@v5
      with:
        path: ~/.cache/huggingface
        key: hf-all-MiniLM-L6-v2

    - name: Install ML dependencies
      run: |
        pip install --upgrade pip
        # 只用 CPU 版 torch，避免下载数 GB 的 CUDA 依赖
        pip install torch --index-url https://download.pytorch.org/whl/cpu
        pip install -r requirements.txt

    - name: Run training script
      env:
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      run: python train.py

    - name: Trigger Amplify rebuild
      env:
        AMPLIFY_WEBHOOK_URL: ${{ secrets.AMPLIFY_WEBHOOK_URL }}
      run: |
        # 去掉 secret 中可能误粘贴的空白、换行和引号
        url=$(printf '%s' "$AMPLIFY_WEBHOOK_URL" | tr -d "[:space:]\"'")
        if [ -z "$url" ]; then
          echo "⚠️ AMPLIFY_WEBHOOK_URL 未设置，跳过 rebuild"
          exit 0
        fi
        case "$url" in
          https://*) ;;
          *) echo "::error::AMPLIFY_WEBHOOK_URL 格式不正确（应以 https:// 开头，长度 ${#url}）"; exit 1 ;;
        esac
        echo "===> Training complete, triggering Amplify rebuild..."
        curl -fsS -X POST -d '{}' -H "Content-Type: application/json" "$url"
        echo "✅ Amplify rebuild triggered!"
