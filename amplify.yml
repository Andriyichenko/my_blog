version: 1
frontend:
  phases:
    preBuild:
      commands:
        - echo "===> Installing frontend dependencies..."
        - npm ci --legacy-peer-deps
    build:
      commands:
        - echo "===> Building Astro site..."
        - npm run build
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*